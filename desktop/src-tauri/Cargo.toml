[package]
name = "erpnext-desktop"
version = "0.1.0"
description = "ERPNext on the desktop, with a local cache and ESG built in"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexterp-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[[bin]]
name = "erpnext-desktop"
path = "src/main.rs"
