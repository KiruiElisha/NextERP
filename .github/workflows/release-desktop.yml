name: Release desktop app

# Builds the desktop app for Windows, macOS and Linux and publishes the installers, named ERPNext,
# to a GitHub Release. Runs on every push to main that touches desktop/, as version
# <major>.<minor>.<run number> from tauri.conf.json (tag desktop-v0.1.N). A pushed v*.*.* tag
# releases exactly that version; it can also be run by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/release-desktop.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            base=$(jq -r .version desktop/src-tauri/tauri.conf.json)
            version="$(echo "$base" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
            tag="desktop-v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # One draft before the builds start, published only when every build has uploaded.
      - name: Create draft release
        id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: `ERPNext desktop ${process.env.VERSION}`,
              body: [
                'ERPNext on the desktop, with a local cache for instant lists and search, and ESG built in.',
                '',
                'Sign in with the address of your ERPNext site (it needs the `nexterp` and `ghg` apps installed).',
                '',
                '- **Windows:** `.msi` or `-setup.exe`',
                '- **macOS:** `.dmg` (universal: Apple silicon and Intel)',
                '- **Linux:** `.AppImage`, `.deb` or `.rpm`',
                '',
                'Builds are not code-signed yet: Windows SmartScreen and macOS Gatekeeper warn on first open (macOS: right-click, Open).',
              ].join('\n'),
              draft: true,
              generate_release_notes: true,
            })
            return data.id

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version
        shell: bash
        run: |
          jq --arg v "${{ needs.create-release.outputs.version }}" '.version = $v' \
            desktop/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp desktop/src-tauri/tauri.conf.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install JavaScript dependencies
        shell: bash
        run: npm ci --prefix desktop && npm ci --prefix desktop/ui

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            })
