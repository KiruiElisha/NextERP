name: Release desktop app

# Builds the desktop app for Windows, macOS and Linux and publishes the installers, named NextERP,
# to a GitHub Release. Runs on every push to main that touches desktop/, as version
# <major>.<minor>.<run number> from tauri.conf.json (tag desktop-v0.1.N). A pushed v*.*.* tag
# releases exactly that version; it can also be run by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/release-desktop.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            base=$(jq -r .version desktop/src-tauri/tauri.conf.json)
            version="$(echo "$base" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
            tag="desktop-v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Which signatures this release carries, for its notes (secrets can't be read in `if:`).
      - name: What is signed
        id: signed
        env:
          MAC: ${{ secrets.APPLE_CERTIFICATE }}
          WIN_AZURE: ${{ secrets.AZURE_CLIENT_SECRET }}
          WIN_PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          UPD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          echo "mac=$([ -n "$MAC" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "win=$([ -n "$WIN_AZURE$WIN_PFX" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "updates=$([ -n "$UPD" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # One draft before the builds start, published only when every build has uploaded.
      - name: Create draft release
        id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MAC_SIGNED: ${{ steps.signed.outputs.mac }}
          WIN_SIGNED: ${{ steps.signed.outputs.win }}
          UPDATES: ${{ steps.signed.outputs.updates }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: `NextERP ${process.env.VERSION}`,
              body: [
                'NextERP, the desktop app for ERPNext: a local cache for instant lists and search, and ESG built in.',
                '',
                'Sign in with the address of your ERPNext site (it needs the `nexterp` and `ghg` apps installed).',
                '',
                '- **Windows:** `.msi` or `-setup.exe`',
                '- **macOS:** `.dmg` (universal: Apple silicon and Intel)',
                '- **Linux:** `.AppImage`, `.deb` or `.rpm`',
                '',
                process.env.WIN_SIGNED === 'yes' ? '- Windows installers are code-signed.' : '- Windows installers are not code-signed: SmartScreen warns on first open (More info, Run anyway).',
                process.env.MAC_SIGNED === 'yes' ? '- macOS app is signed with a Developer ID and notarized by Apple.' : '- macOS app is not signed: Gatekeeper warns on first open (right-click, Open).',
                process.env.UPDATES === 'yes' ? '- Installed apps update themselves from here (updates are signed and checked before installing).' : '',
              ].join('\n'),
              draft: true,
              generate_release_notes: true,
            })
            return data.id

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version
        shell: bash
        run: |
          jq --arg v "${{ needs.create-release.outputs.version }}" '.version = $v' \
            desktop/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp desktop/src-tauri/tauri.conf.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install JavaScript dependencies
        shell: bash
        run: npm ci --prefix desktop && npm ci --prefix desktop/ui

      # Signing: each part switches on only when its secrets are set (Settings, Secrets and variables,
      # Actions), so a build without them still releases, unsigned. See docs/signing.md.
      - name: Signed updates
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ vars.UPDATER_PUBKEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PUBKEY" ]; then echo "Updates not signed: TAURI_SIGNING_PRIVATE_KEY or UPDATER_PUBKEY missing"; exit 0; fi
          conf=desktop/src-tauri/tauri.conf.json
          jq --arg k "$PUBKEY" --arg u "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
            '.bundle.createUpdaterArtifacts = true | .plugins.updater = {pubkey: $k, endpoints: [$u]}' "$conf" > conf.tmp && mv conf.tmp "$conf"
          { echo "TAURI_SIGNING_PRIVATE_KEY<<KEY_END"; echo "$KEY"; echo "KEY_END"; echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"

      - name: Sign for macOS (Developer ID, notarized)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then echo "macOS app not signed: APPLE_CERTIFICATE missing"; exit 0; fi
          { echo "APPLE_CERTIFICATE<<CERT_END"; echo "$CERT"; echo "CERT_END"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"; echo "APPLE_SIGNING_IDENTITY=$IDENTITY"; } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::warning::Signed but not notarized: APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID missing"
          fi

      - name: Install Azure Trusted Signing client
        if: matrix.platform == 'windows-latest' && vars.TRUSTED_SIGNING_ACCOUNT != ''
        run: cargo install trusted-signing-cli --locked

      - name: Sign for Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TS_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          conf=desktop/src-tauri/tauri.conf.json
          if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$TS_ACCOUNT" ]; then
            # Azure Trusted Signing: the key stays in Azure; the build asks it to sign each file.
            jq --arg c "trusted-signing-cli -e $TS_ENDPOINT -a $TS_ACCOUNT -c $TS_PROFILE -d NextERP %1" \
              '.bundle.windows.signCommand = $c' "$conf" > conf.tmp && mv conf.tmp "$conf"
            { echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"; echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"; echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"; } >> "$GITHUB_ENV"
            echo "Windows: signing with Azure Trusted Signing"
          elif [ -n "$PFX" ]; then
            # A .pfx certificate: imported for this run only, then signed by its thumbprint.
            echo "$PFX" | base64 -d > cert.pfx
            thumb=$(powershell -NoProfile -Command "\$p = ConvertTo-SecureString -String \$env:PFX_PASSWORD -AsPlainText -Force; (Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint")
            rm -f cert.pfx
            jq --arg t "$(echo "$thumb" | tr -d '\r ')" \
              '.bundle.windows.certificateThumbprint = $t | .bundle.windows.digestAlgorithm = "sha256" | .bundle.windows.timestampUrl = "http://timestamp.digicert.com"' \
              "$conf" > conf.tmp && mv conf.tmp "$conf"
            echo "Windows: signing with the imported certificate"
          else
            echo "Windows installers not signed: no Azure Trusted Signing or WINDOWS_CERTIFICATE"
          fi

      # Bundling downloads its tools (WiX, linuxdeploy) from GitHub's release servers, which sometimes
      # answer 503. That happens before anything is uploaded, so one more try after a pause is safe.
      - name: Build and upload to the release
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Wait before trying again
        if: steps.build.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Build and upload to the release (second try)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            })
