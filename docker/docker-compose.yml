# Local ERPNext + NextERP for the desktop app (ERPNext v16 by default).
# Requires Docker Engine / Docker Desktop. Start: see README.md in this folder.
#
# Based on the frappe_docker single-server layout. The nexterp app is mounted from
# NEXTERP_APP_PATH: a folder holding the `nexterp` package (repo: the checkout's root), or the
# nexterp-app volume the desktop app copies the package into. The image only knows the apps it was built with, so PYTHONPATH
# makes Python find this one in every container (web, workers, scheduler).

name: nexterp-local

x-backend: &backend
  image: frappe/erpnext:${ERPNEXT_VERSION:-v16.54.0}
  pull_policy: missing
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    - ${NEXTERP_APP_PATH:-..}:/home/frappe/frappe-bench/apps/nexterp
  environment:
    DB_HOST: db
    DB_PORT: "3306"
    REDIS_CACHE: redis-cache:6379
    REDIS_QUEUE: redis-queue:6379
    SOCKETIO_PORT: "9000"
    PYTHONPATH: /home/frappe/frappe-bench/apps/nexterp

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped

  configurator:
    <<: *backend
    command:
      - bash
      - -c
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    restart: "no"

  backend:
    <<: *backend
    # gunicorn, as in Frappe's own production images: several workers, no code reloader and no
    # debugger (bench serve's development server has both, and runs as one process)
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --threads=4
      - --workers=2
      - --worker-class=gthread
      - --worker-tmp-dir=/dev/shm
      - --timeout=120
      - --preload
      - frappe.app:application
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *backend
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      # this computer only: the site's Administrator must not be reachable from the network
      - "127.0.0.1:${HTTP_PORT:-8000}:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *backend
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *backend
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *backend
    command: ["bench", "schedule"]
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  sites:
  logs:
  db-data:
  # the desktop app sets NEXTERP_APP_PATH=nexterp-app and copies the app in (docker compose cp)
  nexterp-app:
