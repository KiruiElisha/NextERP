[project]
name = "nexterp"
authors = [
    { name = "Rono", email = "ronoelisha625@gmail.com" }
]
description = "ERPNext on the desktop: the server side of the desktop app (sync, home, quick entry, ESG)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # the assistant's Claude provider (nexterp/api/ai.py); the others use requests
    "anthropic>=2.6,<3",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
